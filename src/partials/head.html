<script>
  /* Motion gate: hide intro elements only when motion is allowed, and
     reveal everything after 3s if the animation scripts never arrive. */
  (function (d) {
    var r = d.documentElement; r.classList.add('js');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      r.classList.add('motion');
      setTimeout(function () { if (!r.classList.contains('motion-ready')) r.classList.remove('motion'); }, 3000);
    }
  })(document);
</script>
