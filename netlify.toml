# Netlify: the site is plain static files, no build step needed.
[build]
  publish = "site"

# Waitlist sign-ups are checked by a small function (Cloudflare Turnstile).
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fonts and vendored libraries never change without a rename: cache for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The old single-product URL moved under /tipstore/.
[[redirects]]
  from = "/pricing.html"
  to = "/tipstore/pricing.html"
  status = 301

[[redirects]]
  from = "/ecosystem.html"
  to = "/products.html"
  status = 301

# The form definition file is for Netlify only.
[[headers]]
  for = "/forms/*"
  [headers.values]
    X-Robots-Tag = "noindex"
